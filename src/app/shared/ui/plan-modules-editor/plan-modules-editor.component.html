<section class="modules-editor" aria-labelledby="modules-editor-heading">
  <h3 id="modules-editor-heading" class="modules-editor__heading">
    Modules ({{ modules().length }}) · {{ totalMinutes() }} min
  </h3>
  <ul class="modules-editor__list">
    @for (module of modules(); track $index) {
      <li class="modules-editor__row" [class.modules-editor__row--invalid]="!isValid(module)">
        <span class="modules-editor__index" aria-hidden="true">{{ $index + 1 }}</span>
        <label class="modules-editor__sr" [for]="'module-type-' + $index">
          Type du module {{ $index + 1 }}
        </label>
        <select
          class="modules-editor__type"
          [id]="'module-type-' + $index"
          [value]="module.type"
          (change)="typeChanged($index, $any($event.target).value)"
        >
          @for (option of typeOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <label class="modules-editor__sr" [for]="'module-duration-' + $index">
          Durée du module {{ $index + 1 }} (min)
        </label>
        <input
          class="modules-editor__duration"
          [id]="'module-duration-' + $index"
          type="number"
          [attr.min]="durationMin"
          [attr.max]="durationMax"
          step="1"
          [value]="module.durationMinutes"
          (change)="durationChanged($index, $any($event.target).value)"
        />
        <label class="modules-editor__sr" [for]="'module-instruction-' + $index">
          Consigne du module {{ $index + 1 }}
        </label>
        <input
          class="modules-editor__instruction"
          [id]="'module-instruction-' + $index"
          type="text"
          [attr.maxlength]="instructionMax"
          [value]="module.instruction"
          (change)="instructionChanged($index, $any($event.target).value)"
        />
        <button
          nz-button
          nzDanger
          nzSize="small"
          type="button"
          [attr.aria-label]="'Supprimer le module ' + ($index + 1)"
          (click)="remove($index)"
        >
          ✕
        </button>
      </li>
    }
  </ul>
  @if (hasInvalid()) {
    <p class="modules-editor__error" role="alert">
      Un module a une durée hors de 1 à 1440 minutes ou une consigne vide.
    </p>
  }
</section>
