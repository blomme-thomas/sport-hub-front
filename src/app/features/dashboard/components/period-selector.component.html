<div class="period">
  <div class="period__options" role="group" aria-label="Période affichée">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="period__option"
        [attr.aria-pressed]="value() === option.value"
        [attr.aria-label]="option.spokenLabel"
        (click)="changed.emit(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
  <button
    type="button"
    class="period__calendar"
    disabled
    aria-label="Choisir des dates (bientôt disponible)"
    title="Bientôt disponible"
  >
    <sh-icon name="calendar" color="currentColor" />
  </button>
</div>
