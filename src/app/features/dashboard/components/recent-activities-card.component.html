<section class="recent" aria-labelledby="recent-heading" [attr.aria-busy]="loading()">
  <h2 id="recent-heading" class="recent__heading">
    <sh-icon name="list" color="var(--sh-success)" />
    <span>Détails par séance</span>
  </h2>

  @if (error(); as failure) {
    <div class="recent__error" role="alert">
      <p>{{ failure.userMessage }}</p>
      <button nz-button nzType="primary" type="button" (click)="retry.emit()">Réessayer</button>
    </div>
  } @else if (activities() === undefined) {
    <p class="recent__status">Chargement…</p>
  } @else if (activities(); as list) {
    @if (list.length === 0) {
      <p class="recent__status">Aucune séance récente</p>
    } @else {
      <ul class="recent__list">
        @for (activity of list; track activity.id) {
          <li>
            <sh-recent-activity-row [activity]="activity" (opened)="opened.emit($event)" />
          </li>
        }
      </ul>
    }
  }
</section>
