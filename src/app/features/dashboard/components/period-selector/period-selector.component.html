<div class="period">
  <div class="period__options" role="group" [attr.aria-label]="t.dashboard.period.group">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="period__option"
        [attr.aria-pressed]="value() === option.value"
        [attr.aria-label]="option.spokenLabel"
        (click)="changed.emit(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
  <button
    type="button"
    class="period__calendar"
    disabled
    [attr.aria-label]="t.dashboard.period.calendar"
    [attr.title]="t.dashboard.period.soon"
  >
    <sh-icon name="calendar" color="currentColor" />
  </button>
</div>
