@if (hasData()) {
  <table class="chart-data-table">
    <thead>
      <tr>
        <th scope="col">Libellé</th>
        @for (header of headers(); track $index) {
          <th scope="col">{{ header }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track row.label) {
        <tr>
          <th scope="row">{{ row.label }}</th>
          @for (cell of row.cells; track $index) {
            <td>{{ cell }}</td>
          }
        </tr>
      }
    </tbody>
  </table>
}
