<nz-radio-group
  role="radiogroup"
  [attr.aria-label]="t.dashboard.granularity.group"
  nzButtonStyle="solid"
  [formControl]="control"
>
  <!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
  <label nz-radio-button [nzValue]="'week'">{{ t.dashboard.granularity.week }}</label>
  <label nz-radio-button [nzValue]="'month'">{{ t.dashboard.granularity.month }}</label>
  <!-- eslint-enable @angular-eslint/template/label-has-associated-control -->
</nz-radio-group>
