<div class="recipe-card">
  <button
    type="button"
    class="recipe-card__open"
    [attr.aria-label]="fill(t.nutrition.recipes.card.open, { name: recipe().name })"
    (click)="open.emit(recipe())"
  >
    {{ recipe().name }}
  </button>

  <span class="recipe-card__tags">
    @for (mealTag of recipe().mealTags; track mealTag) {
      <span class="recipe-card__tag recipe-card__tag--{{ mealTag }}">{{ mealLabel(mealTag) }}</span>
    }
  </span>

  @if (detail(); as d) {
    <div class="recipe-card__split">
      <sh-macro-split
        [legend]="false"
        [calories]="d.totals.calories"
        [proteins]="d.totals.proteins"
        [carbohydrates]="d.totals.carbohydrates"
        [fats]="d.totals.fats"
      />
    </div>
  } @else {
    <span class="recipe-card__loading">{{ t.nutrition.recipes.card.loadingTotals }}</span>
  }
</div>
