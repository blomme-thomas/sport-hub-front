<a class="shell__skip-link" href="#contenu">Aller au contenu</a>

<div class="shell">
  <button
    class="shell__menu-toggle"
    type="button"
    aria-controls="navigation-principale"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span class="visually-hidden">{{ menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu' }}</span>
    <span aria-hidden="true">☰</span>
  </button>

  <aside
    id="navigation-principale"
    class="shell__sidebar"
    [class.shell__sidebar--open]="menuOpen()"
    aria-label="Navigation principale"
  >
    <a class="shell__brand" routerLink="/" (click)="closeMenu()">
      <svg class="shell__logo" viewBox="0 0 48 24" aria-hidden="true" focusable="false">
        <path
          d="M0 12H10C13 12 14 5 17.5 5C21 5 21.5 19 25 19C28.5 19 28.5 8 31.5 8C33.5 8 34 12 36 12H48"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>Sport Hub</span>
    </a>

    <nav>
      <ul class="shell__nav">
        <li>
          <a
            class="shell__link"
            routerLink="/"
            routerLinkActive="shell__link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            Tableau de bord
          </a>
        </li>
        <li>
          <a
            class="shell__link"
            routerLink="/goals"
            routerLinkActive="shell__link--active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            Objectifs
          </a>
        </li>
        <li>
          <a
            class="shell__link"
            routerLink="/creneaux"
            routerLinkActive="shell__link--active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            Calendrier
          </a>
        </li>
        <li>
          <a
            class="shell__link"
            routerLink="/parametres"
            routerLinkActive="shell__link--active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            Paramètres
          </a>
        </li>
        @for (label of comingSoon; track label) {
          <li>
            <span
              class="shell__link shell__link--disabled"
              aria-disabled="true"
              title="Bientôt disponible"
            >
              {{ label }}
            </span>
          </li>
        }
      </ul>
    </nav>
  </aside>

  <main id="contenu" class="shell__main" tabindex="-1">
    <router-outlet />
  </main>
</div>
