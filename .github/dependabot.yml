version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # Les PR de mise à jour ciblent develop (jamais main), comme toute PR de feature.
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Les montées de version majeure d'Angular se font à la main (ng update).
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
