name: ci-release

# Garde-fou de version pour les branches release/x.y.z et leur PR vers main.
on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    # Sur une PR vers main, ne s'applique qu'aux PR issues d'une branche release/**.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la version
        shell: bash
        run: |
          set -euo pipefail

          # 1. Nom de branche release/x.y.z
          if [[ ! "$BRANCH" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::La branche '$BRANCH' ne respecte pas le format release/x.y.z"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"

          # 2. Version de l'application = version de la branche
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json est en version $PKG_VERSION, la branche annonce $VERSION"
            exit 1
          fi

          # 3. Version nouvelle : tag absent et supérieure au dernier tag
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Le tag v$VERSION existe déjà"
            exit 1
          fi
          LAST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -n "$LAST" ]; then
            HIGHEST="$(printf '%s\n%s\n' "${LAST#v}" "$VERSION" | sort -V | tail -n 1)"
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::La version $VERSION n'est pas supérieure au dernier tag $LAST"
              exit 1
            fi
          fi

          # 4. CHANGELOG mentionne la version
          ESC="${VERSION//./\\.}"
          if ! grep -Eq "^## \[?v?${ESC}\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md n'a pas de section pour $VERSION"
            exit 1
          fi

          echo "Version $VERSION valide (dernier tag : ${LAST:-aucun})"
